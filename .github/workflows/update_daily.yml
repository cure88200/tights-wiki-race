name: Update Daily Wikipedia Game

on:
  schedule:
    # 日本時間の19:11 (UTCの10:11) に実行
    - cron: "11 10 * * *"
  workflow_dispatch:

jobs:
  update-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run update script
        run: node scripts/update_daily.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily_history.json" && git push)

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ job.status }}" = "success" ] && [ -f discord_payload.json ]; then
            curl -H "Content-Type: application/json" -X POST -d @discord_payload.json "$DISCORD_WEBHOOK"
          else
            curl -H "Content-Type: application/json" -X POST -d '{"content": "🚨 **【tights-wiki-race】** デイリー記事の更新でエラーが発生したよ！ログを確認してね！"}' "$DISCORD_WEBHOOK"
          fi

  trigger-deploy:
    needs: update-daily
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  notify-deploy:
    needs: trigger-deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Deploy Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ needs.trigger-deploy.result }}" = "success" ]; then
            MSG="🚀 **【tights-wiki-race】** GitHub Pagesのデプロイが完了したよ！"
          else
            MSG="🚨 **【tights-wiki-race】** デプロイでエラーが発生したよ！ログを確認してね！"
          fi
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$MSG\"}" "$DISCORD_WEBHOOK"
