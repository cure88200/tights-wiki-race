name: Update Daily Wikipedia Game

on:
  schedule:
    # 日本時間の18:17 (UTCの9:17) に実行
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  update-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run update script
        run: node scripts/update_daily.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily_history.json" && git push)

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ job.status }}" = "success" ] && [ -f discord_payload.json ]; then
            curl -H "Content-Type: application/json" -X POST -d @discord_payload.json "$DISCORD_WEBHOOK"
          else
            curl -H "Content-Type: application/json" -X POST -d '{"content": "🚨 **【tights-wiki-race】** デイリー記事の更新でエラーが発生したよ！ログを確認してね！"}' "$DISCORD_WEBHOOK"
          fi

  trigger-deploy:
    needs: update-daily
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
