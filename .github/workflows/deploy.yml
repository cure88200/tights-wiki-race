name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Version
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BUILD_DATE=$(TZ='Asia/Tokyo' date '+%Y/%m/%d %H:%M')
          sed -i "s#__BUILD_VERSION__#${SHA} (${BUILD_DATE})#g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="🚀 **【tights-wiki-race】** GitHub Pagesのデプロイが完了したよ！ (${{ github.event_name }})"
          else
            MSG="🚨 **【tights-wiki-race】** GitHub Pagesのデプロイでエラーが発生したよ！"
          fi
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$MSG\"}" "$DISCORD_WEBHOOK"
