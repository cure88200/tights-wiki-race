name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Inject Build Version
        run: |
          BUILD_TIME=$(TZ='Asia/Tokyo' date '+%Y/%m/%d %H:%M')
          sed -i "s#__BUILD_VERSION__#${BUILD_TIME}#g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="🚀 **【tights-wiki-race】** GitHub Pagesのデプロイが完了したよ！ (${{ github.event_name }})"
          else
            MSG="🚨 **【tights-wiki-race】** GitHub Pagesのデプロイでエラーが発生したよ！"
          fi
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$MSG\"}" "$DISCORD_WEBHOOK"
